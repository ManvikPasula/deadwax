<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Deadwax">
  <title>Deadwax</title>
  <!--
    The favicon. Next serves this file from app/icon.svg with no build step.

    IT IS A STANDALONE DOCUMENT: a favicon is fetched on its own, so it cannot reference
    var(--color-amber) or anything else from globals.css. The three hexes below are therefore
    COPIES of --color-ink (#08090b), --color-amber (#e9b44c) and --color-amber-bright
    (#f6c968), and components/brand/logo.tsx holds the same geometry against the live tokens.
    CHANGE BOTH FILES OR THE TAB WILL STOP MATCHING THE HEADER.

    The disc is painted rather than left transparent on purpose: an amber-on-transparent mark
    vanishes into a light tab strip, and this product has no light theme to fall back on.
  -->
  <circle cx="16" cy="16" r="15.25" fill="#08090b" />
  <g fill="none" stroke="#e9b44c" stroke-width="1">
    <circle cx="16" cy="16" r="13.5" opacity="0.95" />
    <circle cx="16" cy="16" r="12" opacity="0.75" />
    <circle cx="16" cy="16" r="10.5" opacity="0.6" />
    <circle cx="16" cy="16" r="9" opacity="0.45" />
  </g>
  <path d="M19.6 10.9 L21.6 12.5" fill="none" stroke="#f6c968" stroke-width="1" stroke-linecap="round" />
  <circle cx="16" cy="16" r="5" fill="#e9b44c" />
  <circle cx="16" cy="16" r="1.3" fill="#08090b" />
</svg>
